<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="加温模块俯视图与剖面图"><style>
/* 布局:单栏技术文档,左对齐,宽表格与图各自横向滚动;两处可操作的界面样机穿插在正文中 */
:root{
  --bg:#f3f6f7; --surface:#ffffff; --ink:#12262d; --muted:#56696f; --line:#d3dde0;
  --accent:#0a6f83; --accent-soft:#dcedf0; --heat:#c2541b; --heat-soft:#fbe9dd;
  --ok:#1f8a4c; --warn:#b77a00; --crit:#c0392b;
  --screen:#0e1c22; --screen-fg:#e8f3f5; --screen-dim:#8fa7ae; --screen-card:#18303a;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Consolas",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f181b; --surface:#162328; --ink:#e3eef0; --muted:#94a9af; --line:#2b3d43;
  --accent:#4fb9cd; --accent-soft:#17343b; --heat:#f08a4b; --heat-soft:#3a2417;
  --ok:#4cc27f; --warn:#e0a52b; --crit:#ef6a5b;
  --screen:#081216; --screen-fg:#e8f3f5; --screen-dim:#8fa7ae; --screen-card:#15292f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f181b; --surface:#162328; --ink:#e3eef0; --muted:#94a9af; --line:#2b3d43;
  --accent:#4fb9cd; --accent-soft:#17343b; --heat:#f08a4b; --heat-soft:#3a2417;
  --ok:#4cc27f; --warn:#e0a52b; --crit:#ef6a5b;
  --screen:#081216; --screen-fg:#e8f3f5; --screen-dim:#8fa7ae; --screen-card:#15292f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 64px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
header h1{font-size:clamp(26px,5vw,38px);line-height:1.25;margin:0 0 8px;text-wrap:balance;font-weight:700}
header p{margin:0;color:var(--muted);max-width:44em}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;margin-bottom:10px}
section{display:flex;flex-direction:column;gap:14px;min-width:0}
h2{font-size:23px;margin:0;padding-top:20px;border-top:2px solid var(--ink);line-height:1.35;text-wrap:balance}
h3{font-size:17px;margin:10px 0 0;color:var(--accent)}
p,ul,ol{margin:0;max-width:44em}
ul,ol{padding-left:1.3em}
li+li{margin-top:4px}
a{color:var(--accent)}
b{font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--surface)}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--accent-soft);font-weight:700;white-space:nowrap}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.decisions{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.decisions div{background:var(--surface);padding:14px 16px;min-width:0}
.decisions strong{display:block;font-size:15px;margin-bottom:2px}
.decisions span{font-size:14px;color:var(--muted);line-height:1.6;display:block}
.note{background:var(--heat-soft);border-left:4px solid var(--heat);padding:12px 16px;font-size:15px;max-width:none}
.note.cool{background:var(--accent-soft);border-color:var(--accent)}
figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
figcaption{font-size:13px;color:var(--muted)}
svg text{font-family:var(--sans);fill:var(--ink)}
svg .s{font-size:11px} svg .m{fill:var(--muted);font-size:10.5px}
pre.mermaid{background:var(--surface);border:1px solid var(--line);padding:12px;margin:0;overflow-x:auto}
/* 设备屏幕样机 */
.demo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
@media (max-width:760px){.demo{grid-template-columns:minmax(0,1fr)}}
.demo h4{margin:0 0 8px;font-size:13px;font-family:var(--mono);letter-spacing:.06em;color:var(--muted);font-weight:600}
.dev{background:var(--screen);color:var(--screen-fg);border-radius:14px;padding:14px;border:6px solid #c9d3d6;position:relative;font-size:13px;line-height:1.45;min-width:0}
.dev .top{display:flex;justify-content:space-between;gap:8px;color:var(--screen-dim);font-size:11.5px;margin-bottom:8px;flex-wrap:wrap}
.dev .pt{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.dev .pt b{font-size:16px}
.dev .big{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dev .tile{background:var(--screen-card);border-radius:8px;padding:10px}
.dev .tile small{color:var(--screen-dim);display:block;font-size:11px}
.dev .tile .v{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1.15}
.dev .tile .v i{font-style:normal;font-size:12px;color:var(--screen-dim);margin-left:3px}
.dev .heat .v{color:#ffa262}
.dev .bar{height:8px;background:var(--screen-card);border-radius:4px;margin:10px 0 4px;overflow:hidden}
.dev .bar i{display:block;height:100%;width:58%;background:#3fc0d6}
.dev .row{display:flex;justify-content:space-between;color:var(--screen-dim);font-size:11.5px;gap:8px;flex-wrap:wrap}
.dev .btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.dev button,.ward button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid transparent;padding:7px 4px}
.dev .btns button{background:var(--screen-card);color:var(--screen-fg);border-color:#31505b;font-size:12px}
.dev .btns button.stop{background:#a8322a;border-color:#a8322a;color:#fff;font-weight:700}
.dev .state{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:700;background:#1f8a4c;color:#fff}
.dev .state.paused{background:#c0392b}
.pop{position:absolute;inset:14px;background:rgba(8,18,22,.94);border:2px solid #ffa262;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.pop b{font-size:15px;color:#ffa262}
.pop .act{display:flex;gap:8px}
.pop .act button{flex:1;padding:10px;font-weight:700;font-size:14px}
.pop .yes{background:#1f8a4c;color:#fff}.pop .no{background:#18303a;color:#e8f3f5;border-color:#31505b}
button:focus-visible{outline:3px solid var(--heat);outline-offset:2px}
/* 大屏样机 */
.ward{background:var(--surface);border:1px solid var(--line);padding:12px;min-width:0}
.ward .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bed{border:1px solid var(--line);border-top:5px solid var(--ok);padding:8px 10px;font-size:12.5px;line-height:1.5;min-width:0;background:var(--bg)}
.bed.warn{border-top-color:var(--warn)}.bed.crit{border-top-color:var(--crit)}.bed.idle{border-top-color:var(--line);color:var(--muted)}
.bed.me{outline:2px solid var(--accent);outline-offset:1px}
.bed b{font-size:14px}
.bed .k{font-family:var(--mono);font-variant-numeric:tabular-nums}
.bed .tag{font-weight:700}
.bed.warn .tag{color:var(--warn)}.bed.crit .tag{color:var(--crit)}.bed .tag.ok{color:var(--ok)}
.bed .ops{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.ward button{background:var(--accent);color:var(--surface);font-size:12px;padding:4px 8px}
.ward button.ghost{background:transparent;color:var(--accent);border-color:var(--accent)}
.log{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px;min-height:1.6em}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
footer ol{max-width:none}

svg{background:var(--bg,#fff)}</style>
      <rect width="760" height="250" fill="var(--surface)" stroke="var(--line)"/>
      <text x="20" y="24" class="s" style="font-weight:700">俯视(开盖)</text>
      <rect x="20" y="40" width="420" height="120" rx="12" fill="var(--heat-soft)" stroke="var(--heat)" stroke-width="2"/>
      <path d="M0 70 H390 A20 20 0 0 1 390 110 H70 A20 20 0 0 0 70 150 H460" transform="translate(0,-10)" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round"/>
      <text x="4" y="52" class="m">进液</text><text x="444" y="158" class="m">出液→病人</text>
      <circle cx="420" cy="140" r="5" fill="var(--ink)"/><text x="330" y="176" class="m">出口 NTC 管夹</text>
      <circle cx="230" cy="80" r="4" fill="var(--crit)"/><circle cx="230" cy="120" r="4" fill="var(--crit)"/>
      <text x="240" y="84" class="m">控制 NTC</text><text x="240" y="124" class="m">保护 NTC</text>
      <text x="20" y="196" class="m">槽内管长 0.6 m,三折,转弯半径 12 mm</text>
      <text x="500" y="24" class="s" style="font-weight:700">剖面</text>
      <rect x="500" y="40" width="230" height="130" rx="10" fill="var(--bg)" stroke="var(--muted)"/>
      <rect x="512" y="52" width="206" height="12" fill="var(--line)"/>
      <rect x="512" y="64" width="206" height="4" fill="var(--heat)"/>
      <rect x="512" y="68" width="206" height="36" fill="var(--accent-soft)" stroke="var(--accent)"/>
      <rect x="512" y="106" width="206" height="36" fill="var(--accent-soft)" stroke="var(--accent)"/>
      <rect x="512" y="142" width="206" height="4" fill="var(--heat)"/>
      <rect x="512" y="146" width="206" height="12" fill="var(--line)"/>
      <circle cx="560" cy="105" r="13" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>
      <circle cx="615" cy="105" r="13" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>
      <circle cx="670" cy="105" r="13" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>
      <text x="500" y="190" class="m">灰:气凝胶保温 · 橙:薄膜加热片</text>
      <text x="500" y="206" class="m">蓝:阳极氧化铝板 · 圆:PVC 输液管</text>
      <text x="500" y="222" class="m">上下合模,管壁全周贴合</text>
    </svg>