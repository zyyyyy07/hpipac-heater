<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="系统回路图:注射泵推药到喷头,腹腔气体经过滤器、循环泵、加湿加热后回到喷头"><style>
.svgt{font:500 12.5px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;fill:#14232b}
.svgs{font:12px 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;fill:#5b6b73}
.box{fill:#ffffff;stroke:#d9e0e3;stroke-width:1.4}
.flow{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:7 7;animation:run 1.1s linear infinite}
.f-gas{stroke:#0f8a8f}.f-drug{stroke:#7a3fa8}
.ctrl{fill:none;stroke:#5b6b73;stroke-width:1.2;stroke-dasharray:3 4}
@keyframes run{to{stroke-dashoffset:-14}}
.mist circle{fill:#7a3fa8;opacity:.55;animation:fall 1.6s ease-in infinite}
@keyframes fall{from{transform:translateY(0);opacity:.7}to{transform:translateY(46px);opacity:0}}
</style><rect width="100%" height="100%" fill="#ffffff"/>
        <!-- 腹腔 -->
        <ellipse cx="300" cy="305" rx="190" ry="58" fill="#f4f6f7" stroke="#d2552b" stroke-width="2"/>
        <text class="svgt" x="300" y="318" text-anchor="middle">腹腔 · 气腹 12 mmHg · 41–43 ℃</text>
        <!-- 喷头 -->
        <rect x="282" y="92" width="36" height="34" rx="4" fill="#ffffff" stroke="#14232b" stroke-width="1.6"/>
        <rect x="293" y="126" width="14" height="140" fill="#ffffff" stroke="#14232b" stroke-width="1.4"/>
        <text class="svgt" x="236" y="104" text-anchor="end">喷头歧管 ≤43 ℃</text>
        <text class="svgs" x="236" y="120" text-anchor="end">气和药在这里汇合</text>
        <g class="mist"><circle cx="292" cy="272" r="2.4"/><circle cx="300" cy="276" r="2.4" style="animation-delay:.4s"/><circle cx="309" cy="271" r="2.4" style="animation-delay:.8s"/><circle cx="284" cy="279" r="2" style="animation-delay:1.1s"/><circle cx="316" cy="280" r="2" style="animation-delay:.2s"/></g>
        <!-- 注射泵 -->
        <rect class="box" x="24" y="24" width="168" height="50" rx="6"/>
        <text class="svgt" x="108" y="45" text-anchor="middle">注射泵 + 针筒加热套</text>
        <text class="svgs" x="108" y="63" text-anchor="middle">预热药液,≤43 ℃</text>
        <path class="flow f-drug" d="M192 49 H300 V92"/>
        <!-- 气体回路 -->
        <rect class="box" x="470" y="258" width="146" height="40" rx="6"/>
        <text class="svgt" x="543" y="283" text-anchor="middle">两级过滤器</text>
        <rect class="box" x="470" y="186" width="146" height="40" rx="6"/>
        <text class="svgt" x="543" y="211" text-anchor="middle">循环泵 5–15 L/min</text>
        <rect class="box" x="470" y="104" width="146" height="50" rx="6"/>
        <text class="svgt" x="543" y="125" text-anchor="middle">加湿加热罐</text>
        <text class="svgs" x="543" y="143" text-anchor="middle">CO₂ 加热到饱和湿度</text>
        <path class="flow f-gas" d="M470 300 H448 Q420 300 420 318 H488" style="display:none"/>
        <path class="flow f-gas" d="M455 316 Q470 316 470 296"/>
        <path class="flow f-gas" d="M543 258 V226"/>
        <path class="flow f-gas" d="M543 186 V154"/>
        <path class="flow f-gas" d="M543 104 V70 H360 Q330 70 330 100 H318"/>
        <text class="svgs" x="440" y="62" text-anchor="middle">加热输气管</text>
        <text class="svgs" x="468" y="336" text-anchor="middle">回气</text>
        <!-- 主机 -->
        <rect class="box" x="24" y="150" width="168" height="54" rx="6"/>
        <text class="svgt" x="108" y="172" text-anchor="middle">主机 + 触摸屏</text>
        <text class="svgs" x="108" y="190" text-anchor="middle">四路加热、保护、计时</text>
        <path class="ctrl" d="M108 150 V74 M192 170 H282 M192 186 H470"/>
        <text class="svgs" x="108" y="228" text-anchor="middle">手术室外有遥控控制台</text>
        <!-- 图例 -->
        <g transform="translate(24,346)"><line x1="0" y1="0" x2="22" y2="0" stroke="#7a3fa8" stroke-width="3.2"/><text class="svgs" x="28" y="4">药液</text>
        <line x1="70" y1="0" x2="92" y2="0" stroke="#0f8a8f" stroke-width="3.2"/><text class="svgs" x="98" y="4">温热 CO₂</text>
        <line x1="166" y1="0" x2="188" y2="0" stroke="#5b6b73" stroke-dasharray="3 4"/><text class="svgs" x="194" y="4">控制和测量</text></g>
      </svg>