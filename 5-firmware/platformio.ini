; hPIPAC 前端加热系统 · 样机主控固件
; 编译: pio run        烧录: pio run -t upload        串口: pio device monitor
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit ADS1X15@^2.5.0
    bblanchon/ArduinoJson@^7.0.4
board_build.partitions = huge_app.csv   ; 程序区 3 MB
