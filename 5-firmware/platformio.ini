; 输液加温监控一体机 · 样机主控固件
; 编译: pio run        烧录: pio run -t upload        串口: pio device monitor
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bogde/HX711@^0.7.5
    adafruit/Adafruit ADS1X15@^2.5.0
    olikraus/U8g2@^2.35.9
    bblanchon/ArduinoJson@^7.0.4
board_build.partitions = huge_app.csv   ; 程序区 3 MB,默认分区只剩 3% 余量
