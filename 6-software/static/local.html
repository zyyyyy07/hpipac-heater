<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=800,initial-scale=1">
<title>本机界面 · hPIPAC 加热系统</title>
<style>
/* 主机 7 英寸触摸屏的本机界面,固定 800×480,不滚动。这是唯一的操作界面。
   所有能点的东西至少 48 px 高,戴手套也能点。 */
:root{--ff:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;--bg:#0e1a1f;--card:#162a31;--fg:#e6f1f3;--dim:#8fa7ae;--rule:#2a444d;
  --ok:#3cc17d;--warn:#e7ab2f;--crit:#f0604f;--acc:#49b8cc;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#a876d9}
*{box-sizing:border-box}
html,body{margin:0;width:800px;height:480px;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:18px/1.3 var(--ff);font-variant-numeric:tabular-nums;position:relative;
  display:grid;grid-template-rows:64px 40px 1fr 84px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.dim{color:var(--dim)}
[hidden]{display:none!important}
button{font:inherit;font-weight:700;border-radius:8px;border:2px solid var(--acc);background:transparent;color:var(--acc);font-size:20px;padding:0 14px;min-height:48px;min-width:64px;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}

/* 顶栏:阶段、计时、三个页签 */
.top{display:flex;align-items:center;gap:12px;padding:0 8px 0 14px;background:var(--card)}
#phName{font-size:34px;font-weight:700;min-width:72px}
#tLabel{font-size:16px;color:var(--dim)}
#timer{font-size:34px;font-weight:700}
#timer.cd{color:var(--fg);font-size:38px}
.sp{flex:1}
.tabs{display:flex;gap:6px}
.tabs button{width:92px;height:52px;border-color:var(--rule);color:var(--dim);font-size:20px}
.tabs button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:#04222a}

/* 提示条:报警优先 */
#strip{display:flex;align-items:center;padding:0 14px;font-size:18px;color:var(--dim);white-space:nowrap;overflow:hidden}
#strip.high{background:var(--crit);color:#fff;font-weight:700}#strip.mid{background:var(--warn);color:#201500;font-weight:700}
#strip.saved{color:var(--ok);font-weight:700}

.pane{padding:8px 10px;min-height:0}

/* 运行页 */
#pRun{display:grid;grid-template-columns:1fr 250px;gap:10px}
.ch{display:grid;grid-template-rows:repeat(5,1fr);gap:4px}
.r{display:grid;grid-template-columns:128px 112px 96px 1fr;align-items:center;gap:8px;background:var(--card);border-radius:6px;padding:0 10px}
.r .n{font-size:17px}.r b{font-size:30px;text-align:right}.r b small{font-size:14px;color:var(--dim);font-weight:400;margin-left:3px}
.r .sv{font-size:15px;color:var(--dim)}
.bar{height:14px;background:#0b1418;border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0}
.bw{display:grid;grid-template-columns:1fr 44px;gap:6px;align-items:center;font-size:15px;color:var(--dim)}
.bw span{text-align:right}
.ip{background:var(--card);border-radius:6px;padding:8px 12px;display:flex;flex-direction:column}
.ip h2{margin:0;font-size:16px;font-weight:400;color:var(--dim)}
#ipMean{font:700 72px/1.05 var(--ff);font-variant-numeric:tabular-nums}
#ipMean.hi{color:var(--crit)}#ipMean.lo{color:var(--warn)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:15px;color:var(--dim);margin-top:auto}
.two b{display:block;font-size:24px;color:var(--fg)}

/* 曲线页 */
#pChart{padding:4px 10px}
#chart{display:block;width:780px;height:284px}
#chart text{fill:var(--dim);font-size:14px;font-variant-numeric:tabular-nums}
#chart text.e{fill:var(--fg);font-size:15px}

/* 设置页:每行  名称 | − 数值 + | 应用 */
#pSet{display:grid;grid-template-rows:repeat(5,1fr);gap:4px}
.s{display:grid;grid-template-columns:1fr 64px 120px 64px 112px;gap:8px;align-items:center;background:var(--card);border-radius:6px;padding:0 10px 0 14px}
.s .n{font-size:19px}.s .n small{display:block;font-size:14px;color:var(--dim)}
.s .v{text-align:center;font-size:30px;font-weight:700}
.s .v small{font-size:14px;color:var(--dim);font-weight:400;margin-left:3px}
.s .v.p{color:var(--warn)}
.s button.pm{font:700 30px/1 var(--ff);padding:0}
.s button.ap{background:var(--acc);color:#04222a}
.seg{grid-column:2/5;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border-color:var(--rule);color:var(--dim)}
.seg button.on{border-color:var(--fg);color:var(--fg);background:#1f4650}
.seg button.on.p{border-color:var(--warn);color:var(--warn)}

/* 底栏:阶段操作、确认报警、消音、中止。三个页签下都在 */
.bot{display:grid;grid-template-columns:1fr auto auto 150px;gap:10px;padding:0 10px 10px}
#bMain{background:var(--acc);color:#04222a;font-size:28px}
#bAbort{border-color:var(--crit);color:var(--crit);font-size:28px}

/* 再确认一次 */
#sheet{position:absolute;inset:0;background:rgba(5,12,15,.82);z-index:8;display:flex;align-items:center;justify-content:center}
#sheet .box{width:640px;background:var(--card);border:3px solid var(--crit);border-radius:10px;padding:22px 24px;display:grid;gap:16px}
#sheet .t{font-size:30px;font-weight:700}
#sheet .d{font-size:19px;color:var(--dim)}
#sheet .b{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#sheet button{min-height:72px;font-size:26px}
#sYes{background:var(--crit);border-color:var(--crit);color:#fff}
#sNo{border-color:var(--dim);color:var(--fg)}

/* 喷雾阶段雾化气停了:盖住顶栏和提示条,是整屏最大的字 */
#stopNow{position:absolute;left:0;top:0;width:800px;height:104px;background:var(--crit);color:#fff;padding:4px 14px;z-index:6;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden}
#stopNow .big{font:700 64px/1.1 var(--ff);letter-spacing:2px}

/* 主控无响应 / 服务程序无响应 / 等待主控连接:整屏 */
#dead{position:absolute;inset:0;z-index:10;background:#1a0d0c;border:8px solid var(--crit);padding:34px 40px;display:flex;flex-direction:column;gap:14px}
#dead.wait{background:var(--bg);border-color:var(--rule)}
#dead .big{font:700 72px/1.1 var(--ff);color:var(--crit)}
#dead.wait .big{color:var(--fg);font-size:48px}
#dead p{margin:0;font-size:22px}
#dead .neb{font-size:28px;font-weight:700;color:#fff;background:var(--crit);border-radius:6px;padding:6px 12px}
</style></head><body>

<div class="top">
  <span id="phName">—</span><span id="tLabel"></span><span id="timer"></span>
  <span class="sp"></span>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="pRun" aria-selected="true">运行</button>
    <button role="tab" data-tab="pChart" aria-selected="false">曲线</button>
    <button role="tab" data-tab="pSet" aria-selected="false">设置</button>
  </div>
</div>
<div id="strip" role="status"></div>

<div id="pRun" class="pane">
  <div class="ch">
    <div class="r"><span class="n">注射筒</span><b><span id="vSyr">--</span><small>℃</small></b><span class="sv" id="sSyr"></span><div class="bw"><div class="bar"><i id="dSyr"></i></div><span id="pSyr"></span></div></div>
    <div class="r"><span class="n">喷头歧管</span><b><span id="vNoz">--</span><small>℃</small></b><span class="sv" id="sNoz"></span><div class="bw"><div class="bar"><i id="dNoz"></i></div><span id="pNoz"></span></div></div>
    <div class="r"><span class="n">加湿罐出口</span><b><span id="vHum">--</span><small>℃</small></b><span class="sv" id="sHum"></span><div class="bw"><div class="bar"><i id="dHum"></i></div><span id="pHum"></span></div></div>
    <div class="r"><span class="n">输气管喷头端</span><b><span id="vTube">--</span><small>℃</small></b><span class="sv" id="sTube"></span><div class="bw"><div class="bar"><i id="dTube"></i></div><span id="pTube"></span></div></div>
    <div class="r"><span class="n">循环泵</span><b><span id="vPump">--</span><small>L/min</small></b><span class="sv" id="sPump"></span><div class="bw"><div class="bar"><i id="dPump"></i></div><span id="pPump"></span></div></div>
  </div>
  <div class="ip">
    <h2>腹腔温度(平均)</h2>
    <div><span id="ipMean">--</span><span class="dim"> ℃</span></div>
    <div id="ipTg" class="dim" style="font-size:16px"></div>
    <div class="two">
      <div>探头 1<b id="ip1">--</b></div><div>探头 2<b id="ip2">--</b></div>
      <div>腹压 mmHg<b id="press">--</b></div><div>雾化气压 kPa<b id="nozP">--</b></div>
    </div>
  </div>
</div>

<div id="pChart" class="pane" hidden>
  <svg id="chart" viewBox="0 0 780 284" role="img" aria-label="最近 30 分钟的腹腔平均温度、输气管喷头端气温、喷头歧管温度、注射筒温度和目标温度曲线"></svg>
</div>

<div id="pSet" class="pane" hidden>
  <div class="s" data-k="target"><span class="n">目标温度<small>37.0–43.0 ℃,按住 − + 连续调</small></span>
    <button class="pm" data-d="-1" aria-label="目标温度减 0.1">−</button><span class="v"><span></span><small>℃</small></span><button class="pm" data-d="1" aria-label="目标温度加 0.1">+</button><button class="ap">应用</button></div>
  <div class="s" data-k="flow"><span class="n">循环流量<small>0–15 L/min,预热、就绪、暴露阶段用</small></span>
    <button class="pm" data-d="-1" aria-label="循环流量减 0.5">−</button><span class="v"><span></span><small>L/min</small></span><button class="pm" data-d="1" aria-label="循环流量加 0.5">+</button><button class="ap">应用</button></div>
  <div class="s" data-k="nebFlow"><span class="n">雾化气流量<small>5–15 L/min,喷雾阶段用</small></span>
    <button class="pm" data-d="-1" aria-label="雾化气流量减 0.5">−</button><span class="v"><span></span><small>L/min</small></span><button class="pm" data-d="1" aria-label="雾化气流量加 0.5">+</button><button class="ap">应用</button></div>
  <div class="s" data-k="exposeMin"><span class="n">暴露时间<small>1–60 分钟</small></span>
    <button class="pm" data-d="-1" aria-label="暴露时间减 1 分钟">−</button><span class="v"><span></span><small>分钟</small></span><button class="pm" data-d="1" aria-label="暴露时间加 1 分钟">+</button><button class="ap">应用</button></div>
  <div class="s" data-k="circInExpose"><span class="n">暴露阶段循环泵<small>开:暴露时继续加热循环</small></span>
    <div class="seg"><button data-v="0">关</button><button data-v="1">开</button></div><button class="ap">应用</button></div>
</div>

<div class="bot">
  <button id="bMain" disabled>—</button>
  <button id="bAck" hidden>确认报警</button>
  <button id="bMute" hidden>消音</button>
  <button id="bAbort" disabled>中止</button>
</div>

<div id="sheet" hidden role="alertdialog" aria-modal="true" aria-labelledby="sT">
  <div class="box"><div class="t" id="sT"></div><div class="d" id="sD"></div>
    <div class="b"><button id="sYes"></button><button id="sNo">取消</button></div></div>
</div>
<div id="stopNow" hidden role="alert"><div class="big">立即停止注射泵</div><div>雾化气已停,药液会不成雾直接滴入。<span id="stopWhy"></span></div></div>
<div id="dead" hidden role="alert"><div class="big" id="dBig"></div><p id="dP1"></p><p id="dP2"></p><p class="neb" id="dNeb" hidden>最后一次收到时正在喷雾:先停注射泵。</p></div>

<script src="/common.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const NEED_ACK = ['IP_HIGH', 'PRESS_HIGH', 'PRESS_LOW', 'WATER_LOW', 'NOZ_BLOCK', 'EXPOSE_END'];
const SER = [{k: 'ipMean', cn: '腹腔平均', c: 'var(--s1)', w: 3}, {k: 'gasEnd', cn: '输气管喷头端', c: 'var(--s2)', w: 2},
  {k: 'noz', cn: '喷头歧管', c: 'var(--s3)', w: 2}, {k: 'syr', cn: '注射筒', c: 'var(--s4)', w: 2}];
// 设置项:设备上报的字段、范围、每按一次改多少
const SETS = {target: {f: 'target', min: 37, max: 43, step: 0.1, n: 1, cn: '目标温度'},
  flow: {f: 'flowSet', min: 0, max: 15, step: 0.5, n: 1, cn: '循环流量'},
  nebFlow: {f: 'nebFlow', min: 5, max: 15, step: 0.5, n: 1, cn: '雾化气流量'},
  exposeMin: {f: 'exposeMin', min: 1, max: 60, step: 1, n: 0, cn: '暴露时间'}};
let cur = new URLSearchParams(location.search).get('dev') || '', dev = null, st = null, netOk = true;
let note = '', noteUntil = 0, tab = 'pRun', sheetTimer = 0, pts = [], histNow = 0;
const pend = {};   // 设置页上改了还没应用的值

function setText(sel, text) { const e = typeof sel === 'string' ? $(sel) : sel; if (e.textContent !== text) e.textContent = text; }
function flash(text) { note = text; noteUntil = Date.now() + 6000; paint(); }
async function send(kind, what, value) {
  if (!dev) return false;
  const body = {dev: dev.id, kind, by: '触摸屏'};
  if (value !== undefined) body.value = value;
  const r = await postJSON('/api/cmd', body);
  flash(r.ok ? '已发出“' + what + '”,等主控执行。' : r.err);
  tick();
  return r.ok;
}

// ---------- 页签 ----------
function showTab(id) {
  tab = id;
  $$('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === id)));
  ['pRun', 'pChart', 'pSet'].forEach(p => { $('#' + p).hidden = p !== id; });
  for (const k in pend) delete pend[k];   // 换页签就丢掉没应用的修改,免得回来时看到过时的数
  if (id === 'pChart') tickHist();
  paint();
}
$$('.tabs button').forEach(b => { b.onclick = () => showTab(b.dataset.tab); });

// ---------- 再确认一次 ----------
function ask(title, detail, yes, fn) {
  setText('#sT', title); setText('#sD', detail); setText('#sYes', yes);
  $('#sheet').hidden = false;
  $('#sYes').onclick = () => { closeSheet(); fn(); };
  clearTimeout(sheetTimer); sheetTimer = setTimeout(closeSheet, 10000);   // 10 秒没选就当取消
}
function closeSheet() { clearTimeout(sheetTimer); $('#sheet').hidden = true; }
$('#sNo').onclick = closeSheet;

$('#bAbort').onclick = () => ask('确认中止?', '加热和循环泵立即全关,转入排气阶段,不能恢复。', '确认中止', () => send('abort', '中止'));
$('#bMain').onclick = () => {
  const a = dev && ACTION[dev.last.ph];
  if (!a) return;
  if (a.confirm) ask(a.confirm, a.hint, '确认' + a.label, () => send(a.kind, a.label));
  else send(a.kind, a.label);
};
$('#bAck').onclick = () => send('ack', '确认报警');
$('#bMute').onclick = () => send('mute', '消音');

// ---------- 设置 ----------
function devVal(k) { return dev ? (k === 'circInExpose' ? !!dev.last.circInExpose : dev.last[SETS[k].f]) : null; }
function shown(k) { return k in pend ? pend[k] : devVal(k); }
function bump(k, d) {
  const s = SETS[k], base = shown(k);
  if (!isNum(base)) return;
  let v = Math.round((base + d * s.step) / s.step) * s.step;
  v = Math.min(s.max, Math.max(s.min, Math.round(v * 10) / 10));
  if (v === devVal(k)) delete pend[k]; else pend[k] = v;
  paint();
}
// 按住连续调:按下先走一步,0.45 秒后每 0.09 秒走一步
function holdable(btn, fn) {
  let t1 = 0, t2 = 0;
  const stop = () => { clearTimeout(t1); clearInterval(t2); };
  btn.addEventListener('pointerdown', e => { e.preventDefault(); if (btn.disabled) return; fn(); t1 = setTimeout(() => { t2 = setInterval(fn, 90); }, 450); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('click', e => { if (e.detail === 0) fn(); });   // 键盘
}
$$('#pSet .s').forEach(row => {
  const k = row.dataset.k;
  row.querySelectorAll('.pm').forEach(b => holdable(b, () => bump(k, +b.dataset.d)));
  row.querySelectorAll('.seg button').forEach(b => { b.onclick = () => { const v = b.dataset.v === '1'; if (v === devVal(k)) delete pend[k]; else pend[k] = v; paint(); }; });
  row.querySelector('.ap').onclick = async () => {
    if (!(k in pend)) return;
    const v = pend[k], s = SETS[k];
    const what = k === 'circInExpose' ? '暴露阶段循环泵改为' + (v ? '开' : '关') : s.cn + '改为 ' + v.toFixed(s.n);
    await send(k, what, v);   // 成功后等设备上报的值和它一样,再自动去掉“未应用”
  };
});
function paintSet(on) {
  $$('#pSet .s').forEach(row => {
    const k = row.dataset.k, dv = devVal(k);
    if (k in pend && pend[k] === dv) delete pend[k];
    const p = k in pend, v = shown(k);
    if (k === 'circInExpose') {
      row.querySelectorAll('.seg button').forEach(b => { const me = (b.dataset.v === '1') === v; b.classList.toggle('on', me); b.classList.toggle('p', me && p); b.disabled = !on; });
    } else {
      const s = SETS[k], ve = row.querySelector('.v');
      setText(ve.firstElementChild, isNum(v) ? v.toFixed(s.n) : '--');
      ve.classList.toggle('p', p);
      row.querySelectorAll('.pm').forEach(b => { b.disabled = !on || !isNum(v) || (+b.dataset.d < 0 ? v <= s.min : v >= s.max); });
    }
    const ap = row.querySelector('.ap');
    ap.disabled = !on || !p; setText(ap, p ? '应用' : '已生效');
  });
}

// ---------- 运行页 ----------
function row(key, v, n, set, duty, on) {
  setText('#v' + key, fx(v, n));
  setText('#s' + key, on ? '设定 ' + fx(set, 1) : '关');
  const d = isNum(duty) ? Math.max(0, Math.min(100, duty)) : 0;
  $('#d' + key).style.width = d + '%';
  setText('#p' + key, d.toFixed(0) + '%');
}

// ---------- 整屏状态:主控无响应 ----------
function dead(kind, L, ago) {
  const d = $('#dead');
  d.hidden = !kind;
  if (!kind) return;
  d.className = kind === 'wait' ? 'wait' : '';
  if (kind === 'wait') {
    setText('#dBig', '等待主控连接');
    setText('#dP1', cur ? '还没有收到主控 ' + cur + ' 的数据。主控上电并连上盒内热点后,这里会自动进入操作界面。' : '还没有收到任何主控的数据。');
    setText('#dP2', '');
  } else if (kind === 'srv') {
    setText('#dBig', '触摸屏服务程序无响应');
    setText('#dP1', '屏幕上的数值已经不再更新,这块屏现在不能操作。');
    setText('#dP2', '加热、报警、指示灯和红色中止键由安全主控自己管,不依赖这块屏。要停机请按红色中止键。');
  } else {
    setText('#dBig', '主控无响应');
    setText('#dP1', '已经 ' + Math.max(5, Math.round(ago)) + ' 秒没有收到安全主控的数据,这块屏现在不能操作。');
    setText('#dP2', '看主控上的指示灯。要停机请按红色中止键,它直接接在安全主控上。');
  }
  $('#dNeb').hidden = !(kind !== 'wait' && L && L.ph === 'NEBULIZE');
}

function paint() {
  if (!netOk) { dead('srv', dev && dev.last); closeSheet(); return; }
  if (!dev) { dead('wait'); closeSheet(); return; }
  const L = dev.last, t = L.t || {}, duty = L.duty || {}, al = L.al || [], ph = L.ph, on = dev.online, tg = L.target;
  dead(on ? '' : 'off', L, st ? st.now - dev.seen : 0);
  if (!on) closeSheet();

  setText('#phName', PH_CN[ph] || ph);
  setText('#tLabel', ph === 'EXPOSE' ? '剩余' : ph === 'IDLE' ? '' : '已用时');
  setText('#timer', ph === 'EXPOSE' ? mmss(L.exposeLeft) : ph === 'IDLE' ? '' : mmss(L.phSec));
  $('#timer').className = ph === 'EXPOSE' ? 'cd' : '';

  // 提示条:报警 > 刚才操作的回话 > 结束时的记录 > 本阶段提示
  const lv = alarmLevel(al), a = ACTION[ph], rd = readiness(L), strip = $('#strip');
  const c = dev.case, lc = dev.lastCase;
  strip.className = lv;
  if (al.length) setText(strip, al.map(x => alarmInfo(x).cn).join(' · ') + '。' + alarmInfo(al[0]).did);
  else if (Date.now() < noteUntil) setText(strip, note);
  else if (ph === 'DONE' && c) { strip.className = 'saved'; setText(strip, '本次记录已保存:' + c.id + '.csv,共 ' + c.rows + ' 行。'); }
  else if (ph === 'PREHEAT') setText(strip, '等待到温:' + [['syr', '注射筒'], ['noz', '喷头歧管'], ['gas', '气体'], ['ip', '腹腔']].map(x => x[1] + (rd[x[0]] ? ' ✓' : ' …')).join('  '));
  else if (ph === 'IDLE' && lc) setText(strip, '上一次记录:' + lc.id + '.csv,共 ' + lc.rows + ' 行。点“开始预热”会自动开始新的记录。');
  else setText(strip, a ? (a.short || a.hint) : '');

  const stopNow = nebStopped(L);
  $('#stopNow').hidden = !stopNow;
  if (stopNow) setText('#stopWhy', nebStopWhy(L));

  // 运行页
  const isOn = ch => channelOn(L, ch);
  row('Syr', t.syr1, 1, tg, duty.syr, isOn('syr'));
  row('Noz', t.noz1, 1, tg, duty.noz, isOn('noz'));
  row('Hum', t.humOut, 1, isNum(tg) ? tg + 1 : null, duty.hum, isOn('hum'));
  row('Tube', t.gasEnd, 1, tg, duty.tube, isOn('tube'));
  row('Pump', L.flow, 1, pumpSet(L), duty.pump, isOn('pump'));
  setText('#ipMean', fx(ipMean(t))); $('#ipMean').className = al.includes('IP_HIGH') ? 'hi' : al.includes('IP_LOW') ? 'lo' : '';
  setText('#ipTg', '目标 ' + fx(tg) + ' ℃');
  setText('#ip1', fx(t.ip1)); setText('#ip2', fx(t.ip2)); setText('#press', fx(L.press)); setText('#nozP', fx(L.nozP, 0));
  $('#nozP').style.color = al.includes('NOZ_BLOCK') ? 'var(--crit)' : al.includes('NOZ_LOW') ? 'var(--warn)' : '';

  paintSet(on);

  // 底栏
  const live = ['PREHEAT', 'READY', 'NEBULIZE', 'EXPOSE'].includes(ph);
  setText('#bMain', a ? a.label : '—');
  $('#bMain').disabled = !on || !a || (ph === 'PREHEAT' && !rd.heat);
  $('#bAbort').disabled = !on || !live;
  $('#bAck').hidden = !al.some(x => NEED_ACK.includes(x)); $('#bMute').hidden = !al.length;
  setText('#bMute', L.muted ? '已消音' : '消音');
  $('#bAck').disabled = $('#bMute').disabled = !on;
}

// ---------- 曲线 ----------
function drawChart() {
  const svg = $('#chart'), W = 780, H = 284, ml = 40, mr = 170, mt = 26, mb = 26, pw = W - ml - mr, ph = H - mt - mb;
  const t1 = histNow || Date.now() / 1000, t0 = t1 - 1800;
  let lo = 36, hi = 45;
  for (const p of pts) for (const s of SER) if (isNum(p[s.k])) { lo = Math.min(lo, p[s.k]); hi = Math.max(hi, p[s.k]); }
  hi = Math.ceil(hi); lo = Math.max(0, Math.floor(lo - 0.5));
  const step = hi - lo > 12 ? 5 : 1;
  if (step === 5) lo = Math.floor(lo / 5) * 5;
  const x = t => ml + (t - t0) / 1800 * pw, y = v => mt + (hi - v) / (hi - lo) * ph;
  let g = '';
  // 图例在左上,右端再直接标名称和当前值
  let lx = ml;
  for (const s of SER) { g += `<path d="M${lx} 10h18" style="stroke:${s.c}" stroke-width="3"/><text x="${lx + 24}" y="15">${s.cn}</text>`; lx += 34 + s.cn.length * 15; }
  g += `<path d="M${lx} 10h18" style="stroke:var(--dim)" stroke-width="2" stroke-dasharray="5 4"/><text x="${lx + 24}" y="15">目标 ℃</text>`;
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step)
    g += `<path d="M${ml} ${y(v)}H${ml + pw}" style="stroke:var(--rule)"/><text x="${ml - 6}" y="${y(v) + 5}" text-anchor="end">${v}</text>`;
  for (let mn = 30; mn >= 0; mn -= 10) {
    const xx = ml + (30 - mn) / 30 * pw;
    g += `<path d="M${xx} ${mt + ph}v5" style="stroke:var(--dim)"/><text x="${xx}" y="${H - 6}" text-anchor="${mn === 30 ? 'start' : mn === 0 ? 'end' : 'middle'}">${mn === 0 ? '现在' : mn + ' 分钟前'}</text>`;
  }
  const path = k => {
    let d = '', prev = null;
    for (const p of pts) {
      if (!isNum(p[k]) || p.ts < t0) { prev = null; continue; }
      d += (prev === null || p.ts - prev > 10 ? 'M' : 'L') + x(p.ts).toFixed(1) + ' ' + y(p[k]).toFixed(1);   // 断开超过 10 秒就断线,不连成直线
      prev = p.ts;
    }
    return d;
  };
  g += `<path d="${path('target')}" fill="none" style="stroke:var(--dim)" stroke-width="1.5" stroke-dasharray="6 5"/>`;
  for (const s of SER.slice().reverse()) g += `<path d="${path(s.k)}" fill="none" style="stroke:${s.c}" stroke-width="${s.w}" stroke-linejoin="round" stroke-linecap="round"/>`;
  const last = pts.length ? pts[pts.length - 1] : null, labs = [];
  if (last && t1 - last.ts < 10) {
    for (const s of SER) if (isNum(last[s.k])) labs.push({y: y(last[s.k]), c: s.c, text: s.cn + ' ' + last[s.k].toFixed(1), dash: ''});
    if (isNum(last.target)) labs.push({y: y(last.target), c: 'var(--dim)', text: '目标 ' + last.target.toFixed(1), dash: '4 3'});
    labs.sort((a, b) => a.y - b.y);
    for (let i = 1; i < labs.length; i++) labs[i].y = Math.max(labs[i].y, labs[i - 1].y + 18);
    for (let i = labs.length - 1; i >= 0; i--) labs[i].y = Math.min(labs[i].y, mt + ph - (labs.length - 1 - i) * 18);
    for (const l of labs) g += `<path d="M${ml + pw + 6} ${l.y}h16" style="stroke:${l.c}" stroke-width="3" stroke-dasharray="${l.dash}"/><text class="e" x="${ml + pw + 28}" y="${l.y + 5}">${l.text}</text>`;
  } else if (!pts.length) {
    g += `<text x="${ml + pw / 2}" y="${mt + ph / 2}" text-anchor="middle">最近 30 分钟没有数据</text>`;
  }
  svg.innerHTML = g;   // 只含上面拼出来的数字和固定文字
}
async function tickHist() {
  if (!dev || tab !== 'pChart') return;
  try { const j = await getJSON('/api/history?sec=1800&dev=' + encodeURIComponent(dev.id)); if (j.dev === cur) { pts = j.pts; histNow = j.now; drawChart(); } } catch (e) {}
}

async function tick() {
  try {
    st = await getJSON('/api/state'); netOk = true;
    if (!cur && st.devices.length) cur = st.devices[0].id;
    dev = st.devices.find(d => d.id === cur) || null;
  } catch (e) { netOk = false; }
  paint();
}
setInterval(tick, 1000); setInterval(tickHist, 5000); tick();
