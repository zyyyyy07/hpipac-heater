<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>零件三维查看器</title>
<style>
:root{--bg:#10191d;--panel:#18262c;--fg:#e4eef0;--dim:#8fa5ac;--line:#2c414a;--acc:#4fb9cd;--warn:#f0a44b;--crit:#ef6a5b;--ok:#4cc27f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 "Microsoft YaHei","PingFang SC",sans-serif;display:grid;grid-template-columns:300px 1fr;grid-template-rows:100%}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
h1{font-size:17px;margin:0}h2{font-size:12px;margin:0 0 6px;color:var(--acc);letter-spacing:.06em}
.parts{display:flex;flex-direction:column;gap:3px}
.parts button{text-align:left;background:transparent;border:1px solid transparent;color:var(--fg);padding:6px 8px;border-radius:5px;cursor:pointer;font:inherit}
.parts button:hover{border-color:var(--line)}.parts button.on{background:#21404a;border-color:var(--acc)}
.parts small{color:var(--dim);margin-left:6px}
.p{display:grid;grid-template-columns:1fr 78px;gap:4px 8px;align-items:center;margin-bottom:6px}
.p label{color:var(--dim);font-size:13px}.p input[type=number]{width:100%;background:#0c1417;border:1px solid var(--line);color:var(--fg);padding:4px 6px;border-radius:4px;font:inherit;font-family:Consolas,monospace}
.p input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--acc);margin:0}
.p.chg label{color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--acc);color:#04222a;border:0;border-radius:5px;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer;flex:1}
.btn.g{background:transparent;color:var(--acc);border:1px solid var(--acc)}.btn:disabled{opacity:.45;cursor:default}
main{position:relative;min-width:0}canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:14px;top:12px;background:rgba(16,25,29,.82);border:1px solid var(--line);border-radius:6px;padding:10px 12px;max-width:min(460px,90%);pointer-events:none}
#hud b{font-size:16px}#hud .k{font-family:Consolas,monospace;color:var(--acc)}#hud div{margin-top:2px}
#msg{position:absolute;left:14px;bottom:12px;right:14px;color:var(--dim);font-size:13px;white-space:pre-wrap;max-height:40%;overflow:auto}
#msg.err{color:var(--crit);font-weight:700}#msg.ok{color:var(--ok)}
#tools{position:absolute;right:12px;top:12px;display:flex;gap:6px}
#tools button{background:rgba(16,25,29,.82);border:1px solid var(--line);color:var(--fg);border-radius:5px;padding:6px 10px;cursor:pointer;font:inherit}
#tools button.on{border-color:var(--acc);color:var(--acc)}
@media (max-width:720px){body{grid-template-columns:1fr;grid-template-rows:46% 54%}aside{order:2;border-right:0;border-top:1px solid var(--line)}}
</style></head><body>
<aside>
  <h1>零件三维查看器</h1>
  <div><h2>零件</h2><div class="parts" id="parts"></div></div>
  <div id="params"></div>
  <div class="row"><button class="btn g" id="reset">恢复默认</button><button class="btn" id="save">保存并导出</button></div>
  <div style="color:var(--dim);font-size:12.5px">左键拖动旋转,滚轮缩放,右键拖动平移。改尺寸后模型自动重新生成。“保存并导出”会写入 params.json,并重新导出全部 STEP、STL 和图纸包(PDF、DXF)。</div>
</aside>
<main><canvas id="c"></canvas>
  <div id="hud"></div>
  <div id="tools"><button id="bEdge" class="on">棱线</button><button id="bSec">剖切</button><button id="bFit">适应窗口</button></div>
  <div id="msg"></div>
</main>
<script src="/vendor/three.min.js"></script><script src="/vendor/OrbitControls.js"></script>
<script>
const $=s=>document.querySelector(s);let meta,vals={},cur,busy=false,again=false,timer;
const renderer=new THREE.WebGLRenderer({canvas:$('#c'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.localClippingEnabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x10191d);
const cam=new THREE.PerspectiveCamera(35,1,1,5000);cam.up.set(0,0,1);
const ctl=new THREE.OrbitControls(cam,renderer.domElement);ctl.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x39464b,0.95));const dl=new THREE.DirectionalLight(0xffffff,0.55);dl.position.set(1,-1.5,2);scene.add(dl);
const clip=new THREE.Plane(new THREE.Vector3(0,-1,0),0);
const matAl=new THREE.MeshStandardMaterial({color:0xc9d3d8,metalness:.25,roughness:.55,side:THREE.DoubleSide});
const matPr=new THREE.MeshStandardMaterial({color:0x4a9fb3,metalness:0,roughness:.7,side:THREE.DoubleSide});
const matBuy=new THREE.MeshStandardMaterial({color:0x7d878c,metalness:.1,roughness:.8,side:THREE.DoubleSide});
const matSoft=new THREE.MeshStandardMaterial({color:0xbfe6f2,metalness:0,roughness:.4,side:THREE.DoubleSide,transparent:true,opacity:.45,depthWrite:false});
const matLn=new THREE.LineBasicMaterial({color:0x0b1215});
const matScr=new THREE.MeshStandardMaterial({color:0x0a0f12,metalness:.3,roughness:.25,side:THREE.DoubleSide});
const MATS={AL:matAl,PRINT:matPr,BUY:matBuy,SOFT:matSoft,SCREEN:matScr},KIND={AL:['#c9d3d8','CNC 铝件'],PRINT:['#4a9fb3','3D 打印件'],BUY:['#7d878c','外购件(示意)'],SOFT:['#bfe6f2','病人、针筒、管路(示意)'],SCREEN:['#0a0f12','触摸屏(示意)']};
let shown,group,fitNext=true,sec=false,size=[1,1,1];
function resize(){const m=$('main');renderer.setSize(m.clientWidth,m.clientHeight,false);cam.aspect=m.clientWidth/m.clientHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);
function fit(){const r=Math.hypot(...size)/2;cam.position.set(r*1.9,-r*2.8,r*2.2);ctl.target.set(0,0,0);cam.near=r/50;cam.far=r*40;cam.updateProjectionMatrix();ctl.update()}
function show(d){
  if(group){scene.remove(group);group.traverse(o=>o.geometry&&o.geometry.dispose())}
  group=new THREE.Group();const c=d.center,ev=$('#bEdge').classList.contains('on');
  for(const p of d.parts){const pos=new Float32Array(p.t.length*3);
    for(let i=0;i<p.t.length;i++){const k=p.t[i]*3;pos[i*3]=p.v[k]-c[0];pos[i*3+1]=p.v[k+1]-c[1];pos[i*3+2]=p.v[k+2]-c[2]}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.computeVertexNormals();
    const m=new THREE.Mesh(g,MATS[p.kind]||matAl);m.renderOrder=p.kind=='SOFT'?1:0;group.add(m);
    if(p.kind!='SOFT'){const e=new THREE.LineSegments(new THREE.EdgesGeometry(g,28),matLn);e.visible=ev;e.userData.edge=1;group.add(e)}}
  scene.add(group);size=d.size;applySec();if(shown!==d.id){fit();shown=d.id}
  const how=d.multi?'装配视图,仅供查看,不导出':{CNC:'CNC 加工 · 6061 铝',PRINT:'3D 打印',VIEW:'仅供查看,不导出'}[d.how],I=d.info;
  let h=`<b>${d.title}</b><div>${how}</div><div>外形 <span class="k">${d.size.join(' × ')}</span> mm${d.multi?'':` · 体积 <span class="k">${d.volume}</span> cm³`}${d.valid?'':' · <span style="color:#ef6a5b">实体无效</span>'}</div>`;
  if(+d.id.slice(0,2)<=2) h+=`<div>槽内管长 <span class="k">${I.groove_len}</span> mm · 合模后孔 <span class="k">${I.bore[0]} × ${I.bore[1]}</span> mm</div>
   <div>直槽中心 y = <span class="k">${I.run_y.join(', ')}</span></div><div>M3 螺丝 <span class="k">${I.screws.map(p=>'('+p+')').join(' ')}</span></div>
   <div>定位销 <span class="k">${I.dowels.map(p=>'('+p+')').join(' ')}</span> · 测温孔 x = <span class="k">${I.ntc_x.join(', ')}</span>,高 <span class="k">${I.ntc_z}</span></div>`;
  if(d.multi){const ks=[...new Set(d.parts.map(p=>p.kind))];h+='<div>'+ks.map(k=>`<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${KIND[k][0]};margin-right:5px"></span>${KIND[k][1]}`).join('　')+'</div>'}
  $('#hud').innerHTML=h}
function applySec(){clip.constant=0;[matAl,matPr,matBuy,matSoft,matScr,matLn].forEach(m=>{m.clippingPlanes=sec?[clip]:[];m.needsUpdate=true})}
function say(t,c){const m=$('#msg');m.textContent=t;m.className=c||''}
async function load(){if(busy){again=true;return}busy=true;say('正在生成…');
  try{const id=cur,r=await fetch('/api/mesh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({part:id,params:vals})}),j=await r.json();
    if(r.ok){j.id=id;if(id==cur)show(j);say('')}else say(j.err,'err')}catch(e){say('查看器服务没有响应。请确认 studio.py 还在运行。','err')}
  busy=false;if(again){again=false;load()}}
function pick(id){cur=id;document.querySelectorAll('.parts button').forEach(b=>b.classList.toggle('on',b.dataset.id==id));load()}
function setVal(k,v,from){vals[k]=v;const p=meta.params.find(x=>x.key==k),row=document.getElementById('row-'+k);
  if(from!='n')document.getElementById('n-'+k).value=v;if(from!='r')document.getElementById('r-'+k).value=v;
  row.classList.toggle('chg',Math.abs(v-p.def)>1e-9);clearTimeout(timer);timer=setTimeout(load,350)}
async function init(){meta=await(await fetch('/api/meta')).json();vals={...meta.values};
  $('#parts').innerHTML=meta.parts.map(p=>`<button data-id="${p.id}">${p.title}<small>${{CNC:'CNC',PRINT:'打印',VIEW:'查看'}[p.how]}</small></button>`).join('');
  document.querySelectorAll('.parts button').forEach(b=>b.onclick=()=>pick(b.dataset.id));
  let h='',g='';for(const p of meta.params){if(p.group!=g){if(g)h+='</div>';g=p.group;h+=`<div style="margin-bottom:10px"><h2>${g}</h2>`}
    h+=`<div class="p" id="row-${p.key}"><label for="n-${p.key}">${p.label}</label><input type="number" id="n-${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${vals[p.key]}">
    <input type="range" id="r-${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${vals[p.key]}" aria-label="${p.label}"></div>`}
  $('#params').innerHTML=h+'</div>';
  for(const p of meta.params){document.getElementById('n-'+p.key).onchange=e=>{const v=Math.min(p.max,Math.max(p.min,+e.target.value||p.def));setVal(p.key,v,'')};
    document.getElementById('r-'+p.key).oninput=e=>setVal(p.key,+e.target.value,'r');document.getElementById('row-'+p.key).classList.toggle('chg',Math.abs(vals[p.key]-p.def)>1e-9)}
  resize();pick(meta.parts[0].id)}
$('#reset').onclick=()=>{for(const p of meta.params)setVal(p.key,p.def,'')};
$('#save').onclick=async()=>{const b=$('#save');b.disabled=true;say('正在导出全部零件和图纸,大约需要一分钟…');
  try{const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({params:vals})}),j=await r.json();
    say(r.ok?'已保存并导出到 '+j.out+'\n'+j.log.join('\n'):j.err,r.ok?'ok':'err')}catch(e){say('保存失败:查看器服务没有响应。','err')}b.disabled=false};
$('#bEdge').onclick=e=>{e.target.classList.toggle('on');if(group)group.children.forEach(o=>{if(o.userData.edge)o.visible=e.target.classList.contains('on')})};
$('#bSec').onclick=e=>{sec=!sec;e.target.classList.toggle('on',sec);applySec()};
$('#bFit').onclick=fit;
(function loop(){requestAnimationFrame(loop);ctl.update();renderer.render(scene,cam)})();
init();
</script></body></html>
